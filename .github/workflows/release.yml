name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version part to increment
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked --dev
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(uv run python scripts/bump_version.py "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: make check
      - run: make coverage
      - run: make web-check

      - env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin development "v$VERSION"

      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "v$VERSION" build/web.zip
          --title "Mario's Princess v$VERSION"
          --generate-notes
