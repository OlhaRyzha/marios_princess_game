[project]
name = "marios-princess-game"
version = "0.2.0"
description = "A 2D platform game built with Python and Pygame"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pygame>=2.6.1,<3",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "mypy>=2.3.1",
    "pre-commit>=4.3.0",
    "pygbag>=0.9.2,<1",
    "pyright>=1.1.411",
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.1",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["game", "scripts", "tests", "main.py"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.mypy]
explicit_package_bases = true
files = ["game", "tests", "scripts", "main.py"]
python_version = "3.13"
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
branch = true
source = ["game"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["game"]
