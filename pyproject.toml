[project]
name = "marios-princess-game"
version = "0.1.0"
description = "A 2D platform game built with Python and Pygame"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pygame>=2.6.1,<3",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.0",
    "ruff>=0.14.1",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = '''
/(
  \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["game"]
